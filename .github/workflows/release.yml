name: "自動 Release 並附加 JAR"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: "取得程式碼"
        uses: actions/checkout@v4

      - name: "安裝 Cloudflared"
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: "啟動 Cloudflare Tunnel 本地代理"
        run: |
          cloudflared access tcp --listener 127.0.0.1:12345 \
          --hostname ${{ secrets.PLUGINLIB_HOST }} \
          --service-token-id ${{ secrets.PLUGINLIB_CF_CLIENT_ID }} \
          --service-token-secret ${{ secrets.PLUGINLIB_CF_CLIENT_SECRET }} &
          sleep 10

      - name: "透過 SCP 下載私有依賴 JAR"
        run: |
          mkdir -p libs
          echo "${{ secrets.PLUGINLIB_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          scp -P 12345 -o StrictHostKeyChecking=no -i private_key.pem \
          ${{ secrets.PLUGINLIB_USERNAME }}@127.0.0.1:/PluginLibs/${{ github.event.repository.name }}/*.jar ./libs/
          rm private_key.pem
          echo "DownloadedLibs:"
          ls -ahl ./libs/

      - name: "安裝 JDK25"
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: "使用 Maven 編譯"
        run: mvn clean package -B

      - name: "刪除 original JAR"
        run: rm -f target/original-*.jar

      - name: "上傳 JAR 到 Release"
        uses: softprops/action-gh-release@v3
        with:
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
